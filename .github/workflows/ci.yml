# The testing pipeline: every provider mocked and no real keys. It runs for pull requests into
# `testing`, pushes to `testing`, and on demand; other branches get CI through their PR into `testing`.
name: CI

on:
  pull_request:
    branches: [testing]
  push:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a PR replaces its older run. Pushes to `testing` never cancel each other: each
# merge's push run is its only CI after merging.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: web and shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tsc reads Next.js's generated route types (LayoutProps and friends).
      - run: pnpm --filter web exec next typegen
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test

  e2e:
    name: playwright auth
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: pnpm exec supabase start >/dev/null 2>&1
      - name: Configure web env for e2e
        run: pnpm exec supabase status -o json | node scripts/ci/write-local-supabase-env.mjs
      - name: Seed demo users
        working-directory: web
        run: pnpm seed:demo
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
      - name: Install Playwright Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run auth and landing e2e
        working-directory: web
        # Landing spec is optional so the same job works on auth-only branches.
        run: |
          specs=(e2e/auth.spec.ts)
          if [ -f e2e/landing.spec.ts ]; then
            specs+=(e2e/landing.spec.ts)
          fi
          pnpm e2e -- "${specs[@]}"
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
          ALLOW_DEMO_LOGIN: "false"

  optimizer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: optimizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: optimizer/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check
      - run: pytest -q

  database:
    name: database and mock payments
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The local stack generates ephemeral keys and applies every migration. Its output contains
      # those keys, so keep it out of the public Actions log.
      - name: Start local Supabase
        run: pnpm exec supabase start >/dev/null 2>&1
      - name: Configure database tests
        run: pnpm exec supabase status -o json | node scripts/ci/write-local-supabase-env.mjs
      - run: pnpm --filter web test:db
      - run: pnpm db:types
      - run: git diff --exit-code packages/shared/src/db/database.types.ts

  contracts:
    name: contracts drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: optimizer/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pip install -r optimizer/requirements.txt
      - name: Start the optimizer
        working-directory: optimizer
        env:
          OPTIMIZER_TOKEN: ci-only-token
        run: |
          uvicorn app.main:app --port 8000 &
          for _ in $(seq 1 30); do curl -sf http://localhost:8000/health && exit 0; sleep 1; done
          exit 1
      - run: pnpm api:types
      # The committed OpenAPI types must match what the service serves.
      - run: git diff --exit-code packages/shared/src/optimizer
