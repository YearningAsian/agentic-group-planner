<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Password reset (ADR 0023). The reset action sets redirectTo to
      <app origin>/auth/callback?next=/reset-password, so the token hash is appended to that query.
      /auth/callback verifies it as a recovery token, which signs the member in, then /reset-password
      asks for the new password.
    -->
  </head>
  <body style="margin:0;padding:24px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#0b1b2b;background:#eef3f6;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;">
      <tr>
        <td style="padding:24px;background:#ffffff;border-radius:14px;">
          <h1 style="margin:0 0 12px;font-size:20px;">Reset your password</h1>
          <p style="margin:0 0 20px;font-size:16px;line-height:1.5;">
            Tap the button to choose a new password for {{ .Email }}. The link works once and expires in an hour.
          </p>
          <p style="margin:0 0 20px;">
            <a
              href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery"
              style="display:inline-block;min-height:44px;padding:12px 20px;box-sizing:border-box;border-radius:999px;background:#0b1b2b;color:#ffffff;font-size:16px;text-decoration:none;"
              >Choose a new password</a
            >
          </p>
          <p style="margin:0;font-size:14px;line-height:1.5;color:#4a5b6b;">
            If you didn't ask to reset your password, you can ignore this email. Your password stays the same.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
