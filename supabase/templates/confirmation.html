<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Sign-up confirmation (ADR 0023). The link is built from the Site URL, not RedirectTo, because
      Supabase swaps a redirect it doesn't allow (or a missing one) for the bare Site URL, and
      appending a query to that yields an invalid link. /auth/callback verifies the hash on the
      server, sets the session cookie, and opens the trips home.
    -->
  </head>
  <body style="margin:0;padding:24px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#0b1b2b;background:#eef3f6;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;">
      <tr>
        <td style="padding:24px;background:#ffffff;border-radius:14px;">
          <h1 style="margin:0 0 12px;font-size:20px;">Confirm your email</h1>
          <p style="margin:0 0 20px;font-size:16px;line-height:1.5;">
            Tap the button to confirm {{ .Email }} and open your trips. The link works once and expires in an hour.
          </p>
          <p style="margin:0 0 20px;">
            <a
              href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email"
              style="display:inline-block;min-height:44px;padding:12px 20px;box-sizing:border-box;border-radius:999px;background:#0b1b2b;color:#ffffff;font-size:16px;text-decoration:none;"
              >Confirm email</a
            >
          </p>
          <p style="margin:0;font-size:14px;line-height:1.5;color:#4a5b6b;">
            If you didn't create an account, you can ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
